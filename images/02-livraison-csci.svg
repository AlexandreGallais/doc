<title id="t">Un CSCI se livre toujours de la même façon</title>
<desc id="d">Les composants publient des versions dans un registre. Le dépôt de livraison du CSCI les épingle dans son manifeste, avec la configuration et les scripts. Le tag de ce dépôt est la baseline.</desc>
