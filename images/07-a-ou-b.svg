<title id="t">A et B rangent le même contenu, autrement</title>
<desc id="d">La même grille découpée deux fois. A regroupe par lignes : front, back, extensions, config, delivery. B met le socle dans shared et regroupe le reste par colonnes : csci-a, csci-b, csci-c.</desc>
