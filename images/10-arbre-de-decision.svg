<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="t d">
<title id="t">Choisir une option en quatre questions</title>
<desc id="d">Quatre questions dans l'ordre. Droits à cloisonner par CSCI, équipe dédiée par CSCI ou code surtout spécifique : option B. Équipes stables découpées autrement : option C. Sinon : option A.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;}</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="609" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="32.0" y="44.0" font-size="19" font-weight="700" fill="#0F172A" text-anchor="start">Choisir une option en quatre questions</text>
<text x="32.0" y="68.0" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">Les questions vont des contraintes les plus dures aux préférences. Le premier « oui » décide.</text>
<rect x="90.0" y="100.0" width="460.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
<circle cx="120.0" cy="131.0" r="14" fill="#1E293B"/>
<text x="120.0" y="135.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="146.0" y="127.0" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">Faut-il cloisonner les droits par CSCI ?</text>
<text x="146.0" y="146.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">sous-traitants distincts, confidentialité</text>
<path d="M550 131.0 H628" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="590.0" y="123.0" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">oui</text>
<rect x="630.0" y="108.0" width="240.0" height="46.0" rx="23.0" fill="#1E293B"/>
<text x="750.0" y="136.0" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">B · par CSCI</text>
<path d="M320.0 162 V190" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="330.0" y="181.0" font-size="12" font-weight="600" fill="#475569" text-anchor="start">non</text>
<rect x="90.0" y="192.0" width="460.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
<circle cx="120.0" cy="223.0" r="14" fill="#1E293B"/>
<text x="120.0" y="227.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="146.0" y="219.0" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">Chaque CSCI a-t-il une équipe dédiée ?</text>
<text x="146.0" y="238.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">une équipe porte un CSCI de bout en bout</text>
<path d="M550 223.0 H628" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="590.0" y="215.0" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">oui</text>
<rect x="630.0" y="200.0" width="240.0" height="46.0" rx="23.0" fill="#1E293B"/>
<text x="750.0" y="228.0" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">B · par CSCI</text>
<path d="M320.0 254 V282" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="330.0" y="273.0" font-size="12" font-weight="600" fill="#475569" text-anchor="start">non</text>
<rect x="90.0" y="284.0" width="460.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
<circle cx="120.0" cy="315.0" r="14" fill="#1E293B"/>
<text x="120.0" y="319.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="146.0" y="311.0" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">Le code est-il surtout propre à chaque CSCI ?</text>
<text x="146.0" y="330.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">peu de socle commun, beaucoup de code spécifique</text>
<path d="M550 315.0 H628" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="590.0" y="307.0" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">oui</text>
<rect x="630.0" y="292.0" width="240.0" height="46.0" rx="23.0" fill="#1E293B"/>
<text x="750.0" y="320.0" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">B · par CSCI</text>
<path d="M320.0 346 V374" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="330.0" y="365.0" font-size="12" font-weight="600" fill="#475569" text-anchor="start">non</text>
<rect x="90.0" y="376.0" width="460.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
<circle cx="120.0" cy="407.0" r="14" fill="#1E293B"/>
<text x="120.0" y="411.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="146.0" y="403.0" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">Équipes stables, propriétaires de composants ?</text>
<text x="146.0" y="422.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">découpées autrement que par technique ou par CSCI</text>
<path d="M550 407.0 H628" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="590.0" y="399.0" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">oui</text>
<rect x="630.0" y="384.0" width="240.0" height="46.0" rx="23.0" fill="#1E293B"/>
<text x="750.0" y="412.0" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">C · par équipe</text>
<path d="M320.0 438 V466" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="330.0" y="457.0" font-size="12" font-weight="600" fill="#475569" text-anchor="start">non</text>
<rect x="200.0" y="468.0" width="240.0" height="46.0" rx="23.0" fill="#1E293B"/>
<text x="320.0" y="496.0" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">A · par nature</text>
<text x="90.0" y="556.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Ensuite, choisir le rangement de la configuration (section « Ranger la configuration »).</text>
<text x="90.0" y="578.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Si les équipes sont découpées par technique, C donne la même arborescence que A ; par CSCI, la même que B.</text>
</svg>
