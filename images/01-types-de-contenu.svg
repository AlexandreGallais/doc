<text x="438.0" y="233.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">manifeste des versions</text>
<text x="438.0" y="255.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">configuration retenue</text>
