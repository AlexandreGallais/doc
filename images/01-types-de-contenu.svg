<text x="50.0" y="142.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Code générique, commun à plusieurs CSCI</text>
<rect x="32.0" y="172.0" width="308.0" height="62.0" rx="10" fill="#F1EBFE" stroke="#7A4FD6" stroke-width="1.3"/>
<text x="50.0" y="198.0" font-size="14.5" font-weight="700" fill="#4C1D95" text-anchor="start">Code spécifique</text>
<text x="50.0" y="218.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Code qui n'existe que pour un CSCI</text>
<rect x="32.0" y="248.0" width="308.0" height="62.0" rx="10" fill="#E1F5F1" stroke="#14968A" stroke-width="1.3"/>
<text x="50.0" y="274.0" font-size="14.5" font-weight="700" fill="#115E59" text-anchor="start">Extension</text>
<text x="50.0" y="294.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Code compilé, chargé par le socle</text>
<rect x="32.0" y="324.0" width="308.0" height="62.0" rx="10" fill="#FFF3DA" stroke="#D08A0E" stroke-width="1.3"/>
<text x="50.0" y="350.0" font-size="14.5" font-weight="700" fill="#7A4504" text-anchor="start">Configuration</text>
<text x="50.0" y="370.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Paramètres qui adaptent le socle</text>
