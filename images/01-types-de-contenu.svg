<text x="728.0" y="233.0" font-size="12.5" font-weight="400" fill="#CBD5E1" text-anchor="start">image(s) conteneur</text>
<text x="728.0" y="255.0" font-size="12.5" font-weight="400" fill="#CBD5E1" text-anchor="start">scripts hors image</text>
