<svg xmlns="http://www.w3.org/2000/svg" width="960" height="418" viewBox="0 0 960 418" role="img" aria-labelledby="t d">
<title id="t">Cinq types de contenu, un livrable par CSCI</title>
<desc id="d">Le socle, le code spécifique, les extensions et la configuration alimentent le dépôt de livraison, qui produit le livrable du CSCI : images, scripts, documentation de version.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;}</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="417" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="32.0" y="44.0" font-size="19" font-weight="700" fill="#0F172A" text-anchor="start">Cinq types de contenu, un livrable par CSCI</text>
<text x="32.0" y="68.0" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">Chaque type a son propre cycle de vie ; tous convergent vers le dépôt de livraison du CSCI.</text>
<rect x="32.0" y="96.0" width="308.0" height="62.0" rx="10" fill="#E8F0FE" stroke="#3B6FD4" stroke-width="1.3"/>
